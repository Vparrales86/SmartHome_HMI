<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMI - Domótica & Control Residencial</title>
    <meta name="description" content="Interfaz de Monitoreo y Control para Casa Inteligente con Integración Tuya / Smart Life">
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0A0D14;
            --bg-card: rgba(18, 25, 41, 0.8);
            --bg-control: #182235;
            --border-card: rgba(255, 255, 255, 0.08);
            
            --accent-cyan: #00F2FE;
            --accent-green: #00FF87;
            --accent-red: #FF3366;
            --accent-yellow: #FFD000;
            --accent-blue: #3B82F6;
            --text-main: #E2E8F0;
            --text-muted: #64748B;
            
            --font-main: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 242, 254, 0.05) 0px, transparent 50%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 15, 25, 0.85);
            border-bottom: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFF, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-meta {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-settings {
            background: var(--bg-control);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-settings:hover {
            background: #23314B;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .btn-settings svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .meta-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meta-badge span {
            font-weight: 600;
        }

        /* GRID LAYOUT */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            padding: 24px;
            flex-grow: 1;
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 12px;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* SVG HOUSE PLAN (MÍMICO) */
        .mimic-view {
            background: #06090F;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 520px;
            padding: 20px;
        }

        .house-svg {
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 500px;
        }

        /* Room Styling */
        .room-polygon {
            fill: rgba(30, 41, 59, 0.15);
            stroke: #475569;
            stroke-width: 2.5;
            transition: all 0.3s ease;
        }

        .room-polygon:hover {
            fill: rgba(30, 41, 59, 0.3);
        }

        .room-label {
            fill: #94A3B8;
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Room active glows (e.g. Light on) */
        .room-glow-light {
            fill: rgba(251, 191, 36, 0.07);
        }

        .room-glow-ac {
            fill: rgba(0, 242, 254, 0.04);
        }

        /* Hotspot Buttons overlayed on blueprint */
        .hotspot {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hotspot circle {
            fill: #1E293B;
            stroke: #475569;
            stroke-width: 2;
            transition: all 0.2s ease;
        }

        .hotspot:hover circle {
            transform: scale(1.15);
            stroke: var(--accent-cyan);
        }

        .hotspot svg {
            pointer-events: none;
        }

        .hotspot.active circle {
            fill: rgba(251, 191, 36, 0.15);
            stroke: var(--accent-yellow);
        }

        .hotspot.active svg {
            color: var(--accent-yellow);
            filter: drop-shadow(0 0 5px var(--accent-yellow));
        }

        .hotspot.lock.active circle {
            fill: rgba(239, 68, 68, 0.1);
            stroke: var(--accent-red);
        }
        .hotspot.lock.active svg {
            color: var(--accent-red);
        }

        .hotspot.lock.unlocked circle {
            fill: rgba(16, 185, 129, 0.1);
            stroke: var(--accent-green);
        }
        .hotspot.lock.unlocked svg {
            color: var(--accent-green);
        }

        .hotspot.ac.active circle {
            fill: rgba(0, 242, 254, 0.1);
            stroke: var(--accent-cyan);
        }
        .hotspot.ac.active svg {
            color: var(--accent-cyan);
        }

        /* SIDEBAR DEVICE LIST */
        .device-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 520px;
        }

        .device-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-cyan);
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .device-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .device-room {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .device-status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .device-status-badge.on {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
        }

        .device-status-badge.off {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
        }

        .device-status-badge.locked {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
        }

        .device-status-badge.unlocked {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
        }

        /* MODAL POPUPS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            width: 480px;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slide-up 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-card-title {
            font-size: 1rem;
            font-weight: 700;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .btn-close-modal:hover {
            color: var(--text-main);
        }

        .modal-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .device-details-meta {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-card);
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .device-details-meta span {
            color: var(--text-main);
        }

        /* Interactive controls in modal */
        .modal-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-card);
            padding: 16px;
            border-radius: 10px;
        }

        .modal-control-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Range/AC Controls */
        .ac-temp-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-temp {
            background: var(--bg-control);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        .btn-temp:hover {
            background: #23314B;
            border-color: var(--accent-cyan);
        }

        .temp-display {
            font-family: var(--font-code);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-cyan);
            min-width: 65px;
            text-align: center;
        }

        /* Chart in modal */
        .modal-chart-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 12px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .modal-chart-svg {
            width: 100%;
            height: 120px;
        }

        /* CONFIGURATION MODAL */
        .config-modal {
            width: 500px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            background: var(--bg-control);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-family: var(--font-main);
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-cyan), #00A6FE);
            border: none;
            color: #000;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        /* Toggle Switches */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2D3748;
            transition: .3s;
            border-radius: 24px;
            border: 1px solid var(--border-card);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-title">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent-cyan)" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <h1>HMI - SMART HOME DASHBOARD</h1>
        </div>
        
        <div class="system-meta">
            <div class="meta-badge">INTEGRACIÓN: <span id="sync-mode-badge" style="color: var(--accent-yellow);">MOCK MODE</span></div>
            <button class="btn-settings" onclick="openConfigModal()">
                <svg viewBox="0 0 24 24"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle cx="12" cy="12" r="3"/></svg>
                Tuya API Config
            </button>
        </div>
    </header>

    <!-- CONTENT GRID -->
    <div class="dashboard-container">
        
        <!-- MÍMICO INTERACTIVO (IZQUIERDA) -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"/><path d="M9 3v18M3 12h18"/></svg>
                    Plano de Distribución Doméstica (Mímico)
                </div>
            </div>
            
            <div class="mimic-view">
                <!-- SVG HOUSE BLUEPRINT -->
                <svg class="house-svg" viewBox="0 0 800 500">
                    <defs>
                        <!-- Glow filter for lights -->
                        <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- --- ROOM BOUNDARIES --- -->
                    <!-- Habitación Principal (top left) -->
                    <polygon id="room-hab" class="room-polygon" points="20,20 280,20 280,180 20,180" />
                    <!-- Baño Principal (top center) -->
                    <polygon id="room-bano" class="room-polygon" points="280,20 380,20 380,130 280,130" />
                    <!-- Habitación 2 (top mid-right) -->
                    <polygon id="room-hab2" class="room-polygon" points="380,20 500,20 500,130 380,130" />
                    <!-- Oficina (top right) -->
                    <polygon id="room-oficina" class="room-polygon" points="500,20 650,20 650,130 500,130" />
                    <!-- Pasillo (Hallway) -->
                    <polygon id="room-pasillo" class="room-polygon" points="280,130 650,130 650,180 280,180" />
                    <!-- Lavadero y Cafetería (bottom left) -->
                    <polygon id="room-lavadero" class="room-polygon" points="20,180 280,180 280,480 20,480" />
                    <!-- Sala de Estar / Comedor / TV (bottom center) -->
                    <polygon id="room-sala" class="room-polygon" points="280,180 650,180 650,480 280,480" />
                    <!-- Patio (right side) -->
                    <polygon id="room-patio" class="room-polygon" points="650,20 780,20 780,480 650,480" />
                    <!-- Calle / Entrada (outdoor bottom strip) -->
                    <polygon id="room-calle" class="room-polygon" points="20,480 780,480 780,500 20,500" style="stroke-dasharray: 4 4; fill: rgba(255,255,255,0.01);" />

                    <!-- --- ROOM LABELS --- -->
                    <text x="150" y="80" class="room-label">Hab. Principal</text>
                    <text x="330" y="75" class="room-label">Baño</text>
                    <text x="440" y="75" class="room-label">Habitación 2</text>
                    <text x="575" y="75" class="room-label">Oficina</text>
                    <text x="465" y="155" class="room-label">Pasillo</text>
                    <text x="150" y="330" class="room-label">Cafetería & Lavadero</text>
                    <text x="465" y="330" class="room-label">Sala Principal</text>
                    <text x="715" y="240" class="room-label" transform="rotate(90 715 240)">Patio Exterior</text>
                    <text x="250" y="495" class="room-label" font-size="8" fill="var(--text-muted)">Calle / Acceso Exterior</text>

                    <!-- --- INTERACTIVE HOTSPOTS --- -->
                    
                    <!-- Sensor Temp & Hum (Habitación) -->
                    <g id="hotspot-eb8a029eac3849c00ao5lr" class="hotspot" transform="translate(80, 100)" onclick="openDevice('eb8a029eac3849c00ao5lr')">
                        <circle cx="0" cy="0" r="22" />
                        <g transform="translate(-10, -10)">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
                        </g>
                        <!-- Small text pill overlay -->
                        <rect x="-35" y="26" width="70" height="15" rx="3" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                        <text id="txt-hab-temp" x="0" y="37" fill="var(--accent-cyan)" font-size="9" font-family="monospace" text-anchor="middle">21.5°C</text>
                    </g>

                    <!-- Aire Acondicionado (Habitación) -->
                    <g id="hotspot-eb81eb213ea6311bc5f4x9" class="hotspot ac" transform="translate(180, 60)" onclick="openDevice('eb81eb213ea6311bc5f4x9')">
                        <circle cx="0" cy="0" r="20" />
                        <g transform="translate(-9, -9)">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        </g>
                    </g>

                    <!-- Luz Habitación Principal (switch) -->
                    <g id="hotspot-ebb8c6db4c4b3bb1eek3s" class="hotspot light" transform="translate(180, 120)" onclick="openDevice('ebb8c6db4c4b3bb1eek3s')">
                        <circle cx="0" cy="0" r="18" />
                        <g transform="translate(-8, -8)">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></svg>
                        </g>
                    </g>

                    <!-- Luz Baño -->
                    <g id="hotspot-ebfc0dbec9868bd91fn21v" class="hotspot light" transform="translate(330, 75)" onclick="openDevice('ebfc0dbec9868bd91fn21v')">
                        <circle cx="0" cy="0" r="18" />
                        <g transform="translate(-8, -8)">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .6 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></svg>
                        </g>
                    </g>

                    <!-- Luz Habitación 2 -->
                    <g id="hotspot-ebec82a43c5ca0b656c52g" class="hotspot light" transform="translate(440, 75)" onclick="openDevice('ebec82a43c5ca0b656c52g')">

                    badgeClass += dev.status.on ? " on" : " off";
                    statusText = dev.status.on ? "ON" : "OFF";
                } else if (dev.type === "lock") {
                    badgeClass += dev.status.locked ? " locked" : " unlocked";
                    statusText = dev.status.locked ? "LOCKED" : "UNLOCKED";
                } else if (dev.type === "ac") {
                    badgeClass += dev.status.on ? " on" : " off";
                    statusText = dev.status.on ? `${dev.status.temp}°C` : "OFF";
                } else if (dev.type === "sensor") {
                    statusText = `${dev.status.temp}°C`;
                } else if (dev.type === "remote") {
                    statusText = "STANDBY";

                        <span class="device-room">${dev.room}</span>
                    </div>
                    <span class="${badgeClass}">${statusText}</span>

            toggleHotspotStyle("hotspot-eb026ce6b853f58504jjax", devices["eb026ce6b853f58504jjax"].status.on);
            toggleHotspotStyle("hotspot-eb336cd31719ca0f66lqkg", devices["eb336cd31719ca0f66lqkg"].status.on);
            toggleHotspotStyle("hotspot-eb81eb213ea6311bc5f4x9", devices["eb81eb213ea6311bc5f4x9"].status.on);
            
            toggleHotspotStyle("hotspot-eb4164efd22d7fd73ffg9j", devices["eb4164efd22d7fd73ffg9j"].status.on);
            toggleHotspotStyle("hotspot-ebb8c6db4c4b3bb1eek3s", devices["ebb8c6db4c4b3bb1eek3s"].status.on);
            toggleHotspotStyle("hotspot-ebd912733b8b495a291hfj", devices["ebd912733b8b495a291hfj"].status.on);
            toggleHotspotStyle("hotspot-ebec82a43c5ca0b656c52g", devices["ebec82a43c5ca0b656c52g"].status.on);

        function toggleRoomGlow(roomId, isActive, glowClass) {
            const el = document.getElementById(roomId);
            if (isActive) {
                el.classList.add(glowClass);
            } else {
                el.classList.remove(glowClass);
            }
        }

        function toggleHotspotStyle(hotspotId, isActive) {
            const el = document.getElementById(hotspotId);
            if (isActive) {
                el.classList.add("active");
            } else {
                el.classList.remove("active");
            }
        }

        // --- SIMULATION LOOP (MOCK DATA UPDATE) ---
        function simulationLoop() {
            if (config.mode !== "mock") return;

            // Simulate Temperature sensor fluctuations
            let tempSensor = devices["eb8a029eac3849c00ao5lr"];
            let acDevice = devices["eb81eb213ea6311bc5f4x9"];

            if (acDevice.status.on) {
                // Cool down room towards target AC temperature
                let diff = acDevice.status.temp - tempSensor.status.temp;
                tempSensor.status.temp += diff * 0.1 + (Math.random() * 0.04 - 0.02);
            } else {
                // Drift back to ambient 24°C
                let diff = 24.0 - tempSensor.status.temp;
                tempSensor.status.temp += diff * 0.05 + (Math.random() * 0.04 - 0.02);
            }
            tempSensor.status.hum += (Math.random() * 1.0 - 0.5);
            tempSensor.status.hum = Math.max(30, Math.min(90, tempSensor.status.hum));

            // Record history
            Object.values(devices).forEach(dev => {
                let currentVal = 0;
                if (dev.type === "light" || dev.type === "tv" || dev.type === "remote") {
                    currentVal = dev.status.on ? 1 : 0;
                } else if (dev.type === "lock") {
                    currentVal = dev.status.locked ? 1 : 0;
                } else if (dev.type === "ac") {
                    currentVal = dev.status.on ? dev.status.temp : 0;
                } else if (dev.type === "sensor") {
                    currentVal = dev.status.temp;
                }
                dev.history.push(currentVal);
                if (dev.history.length > 20) dev.history.shift();
            });

            // Update live modal chart if open
            if (currentActiveDeviceId) {
                drawModalChart(devices[currentActiveDeviceId].history);
            }

            renderDeviceList();
            updateVisuals();
        }

        // --- MODAL / CONTROL VIEW ---
        function openDevice(deviceId) {
            currentActiveDeviceId = deviceId;
            const dev = devices[deviceId];
            
            document.getElementById("m-device-name").innerText = dev.name.toUpperCase();
            document.getElementById("m-device-product").innerText = dev.product;
            document.getElementById("m-device-id").innerText = dev.id;
            
            // Render Control elements based on Device Type
            const controlContainer = document.getElementById("m-control-container");
            controlContainer.innerHTML = "";

            if (dev.type === "light" || dev.type === "tv") {
                controlContainer.innerHTML = `
                    <div class="modal-control-row">
                        <span class="modal-control-label">Encendido / Apagado</span>
                        <label class="switch">
                            <input type="checkbox" id="m-switch-state" ${dev.status.on ? "checked" : ""} onchange="onModalToggleClick('${dev.id}', 'on')">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
            } else if (dev.type === "lock") {
                controlContainer.innerHTML = `
                    <div class="modal-control-row">
                        <span class="modal-control-label">Bloqueo de Cerradura</span>
                        <label class="switch">
                            <input type="checkbox" id="m-switch-state" ${dev.status.locked ? "checked" : ""} onchange="onModalToggleClick('${dev.id}', 'locked')">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
            } else if (dev.type === "ac") {
                controlContainer.innerHTML = `
                    <div class="modal-control-row">
                        <span class="modal-control-label">Encendido Aire</span>
                        <label class="switch">
                            <input type="checkbox" id="m-switch-state" ${dev.status.on ? "checked" : ""} onchange="onModalToggleClick('${dev.id}', 'on')">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="modal-control-row">
                        <span class="modal-control-label">Temperatura de Consigna</span>
                        <div class="ac-temp-controls">
                            <button class="btn-temp" onclick="adjustAcTemp(-1)">-</button>
                            <span class="temp-display" id="m-ac-temp">${dev.status.temp}°C</span>
                            <button class="btn-temp" onclick="adjustAcTemp(1)">+</button>
                        </div>
                    </div>
                `;
            } else if (dev.type === "sensor") {
                controlContainer.innerHTML = `
                    <div class="modal-control-row">
                        <span class="modal-control-label">Temperatura Ambiente</span>
                        <span class="temp-display">${dev.status.temp.toFixed(1)}°C</span>
                    </div>
                    <div class="modal-control-row">
                        <span class="modal-control-label">Humedad Relativa</span>
                        <span class="temp-display" style="color: var(--accent-green);">${dev.status.hum.toFixed(0)}%</span>
                    </div>
                `;
            } else if (dev.type === "remote") {
                controlContainer.innerHTML = `
                    <div class="modal-control-row">
                        <span class="modal-control-label">Control Remoto Infrarrojo</span>
                        <span class="device-status-badge on">STANDBY ONLINE</span>
                    </div>
                `;
            }

            // Draw History chart
            drawModalChart(dev.history);

            document.getElementById("device-modal").style.display = "flex";
        }

        function closeDeviceModal() {
            document.getElementById("device-modal").style.display = "none";
            currentActiveDeviceId = null;
        }

        function closeDeviceModalOnOutside(e) {
            if (e.target.id === "device-modal") closeDeviceModal();
        }

        function onModalToggleClick(deviceId, field) {
            const checkbox = document.getElementById("m-switch-state");
            const val = checkbox.checked;
            
            // Apply immediately to state
            devices[deviceId].status[field] = val;
            
            // Add a log entry
            addGlobalLog(`Cambio de estado manual para ${devices[deviceId].name}: ${field} = ${val}`);

            // Send command if in Live mode
            if (config.mode === "live") {
                sendTuyaCommand(deviceId, field, val);
            }

            renderDeviceList();
            updateVisuals();
        }

        function adjustAcTemp(delta) {
            const dev = devices["eb81eb213ea6311bc5f4x9"];
            dev.status.temp = Math.max(16, Math.min(30, dev.status.temp + delta));
            document.getElementById("m-ac-temp").innerText = `${dev.status.temp}°C`;
            
            addGlobalLog(`Ajuste de consigna AC a: ${dev.status.temp}°C`);

            if (config.mode === "live") {
                sendTuyaCommand(dev.id, "temp", dev.status.temp);
            }

            renderDeviceList();
            updateVisuals();
        }

        // --- DRAW SVG MODAL CHART ---
        function drawModalChart(historyData) {
            if (historyData.length < 2) return;

            const xStart = 20;
            const xEnd = 380;
            const yZero = 100;
            const yMax = 20;
            const ySpan = yZero - yMax;

            // Find min/max in data to scale properly
            let min = Math.min(...historyData);
            let max = Math.max(...historyData);
            
            // If binary data (0 and 1)
            if (max === min) {
                max = min + 1;
                min = min - 1;
            } else {
                // Add some margins
                let diff = max - min;
                max += diff * 0.1;
                min -= diff * 0.1;
            }

            let points = [];
            let xStep = (xEnd - xStart) / (historyData.length - 1);

            for (let i = 0; i < historyData.length; i++) {
                let x = xStart + i * xStep;
                let pct = (historyData[i] - min) / (max - min);
                let y = yZero - pct * ySpan;
                points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
            }

            // Path Line
            let dAttr = "M " + points.join(" L ");
            document.getElementById("modal-chart-path").setAttribute("d", dAttr);

            // Area under the chart
            let dArea = dAttr + ` L ${points[points.length-1].split(',')[0]},${yZero} L ${xStart},${yZero} Z`;
            document.getElementById("modal-chart-area").setAttribute("d", dArea);
        }

        // Helper logging function
        function addGlobalLog(message) {
            console.log(`[HMI LOG] ${message}`);
        }

        // --- TUYA BRIDGE API COMMUNICATIONS (LIVE MODE) ---
        function testBridgeConnection() {
            fetch("http://localhost:3000/api/status")
                .then(res => res.json())
                .then(data => {
                    addGlobalLog("Conexión con tuya_bridge exitosa: " + JSON.stringify(data));
                    document.getElementById("m-device-api-status").innerText = "Conectado al Puente";
                    document.getElementById("m-device-api-status").style.color = "var(--accent-green)";
                })
                .catch(err => {
                    addGlobalLog("Error conectando al servidor tuya_bridge local: " + err.message);
                    document.getElementById("m-device-api-status").innerText = "Sin conexión con tuya_bridge";
                    document.getElementById("m-device-api-status").style.color = "var(--accent-red)";
                });
        }

        function queryLiveTuyaApi() {
            if (config.mode !== "live") return;

            // Fetch device status list from local bridge
            fetch("http://localhost:3000/api/devices")
                .then(res => res.json())
                .then(apiDevices => {
                    // Update frontend states based on returned states
                    apiDevices.forEach(apiDev => {
                        const localDev = devices[apiDev.id];
                        if (localDev) {
                            localDev.status = apiDev.status;
                            // Add history logic
                            let currentVal = 0;
                            if (localDev.type === "light" || localDev.type === "tv" || localDev.type === "remote") {
                                currentVal = localDev.status.on ? 1 : 0;
                            } else if (localDev.type === "lock") {
                                currentVal = localDev.status.locked ? 1 : 0;
                            } else if (localDev.type === "ac") {
                                currentVal = localDev.status.on ? localDev.status.temp : 0;
                            } else if (localDev.type === "sensor") {
                                currentVal = localDev.status.temp;
                            }
                            localDev.history.push(currentVal);
                            if (localDev.history.length > 20) localDev.history.shift();
                        }
                    });
                    
                    renderDeviceList();
                    updateVisuals();
                    if (currentActiveDeviceId) {
                        drawModalChart(devices[currentActiveDeviceId].history);
                    }
                })
                .catch(err => {
                    addGlobalLog("Fallo al actualizar desde Tuya Bridge: " + err.message);
                });
        }

        function sendTuyaCommand(deviceId, commandType, value) {
            if (config.mode !== "live") return;

            fetch(`http://localhost:3000/api/device/${deviceId}/command`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command: commandType, value: value })
            })
            .then(res => res.json())
            .then(data => {
                addGlobalLog("Comando Tuya enviado con éxito: " + JSON.stringify(data));
            })
            .catch(err => {
                addGlobalLog("Error al enviar comando a Tuya: " + err.message);
            });
        }
    </script>
